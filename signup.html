<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .form-container {
            width: 50%;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 3px 3px 10px gray;
            background-color: #f9f9f9;
        }
        h2 {
            text-align: center;
            color: blue;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .checkbox-group, .radio-group {
            margin-top: 10px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>LOGIN FORM</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" placeholder="Enter your Username" required>
        </div>
        <div class="form-group">
            <label>Father:</label>
            <input type="text" placeholder="Enter your father's name" required>
        </div>
        <div class="form-group">
            <label>Mother:</label>
            <input type="text" placeholder="Enter your mother's name" required>
        </div>
        <div class="form-group">
            <label>SRN:</label>
            <input type="text" placeholder="Enter your SRN" required>
        </div>
        <div class="form-group">
            <label>Address:</label>
            <textarea placeholder="Enter your address" required></textarea>
        </div>
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" 
                   pattern="[0-9]{10}" maxlength="10" required>
            <span id="phoneError" class="error"></span>
        </div>

        <div class="checkbox-group">
            <label><strong>Qualification:</strong></label><br>
            <input type="checkbox"> I have passed 10th<br>
            <input type="checkbox"> I have passed 12th<br>
            <input type="checkbox"> I'm graduated
        </div>

        <div class="radio-group">
            <label><strong>Gender:</strong></label><br>
            <input type="radio" name="gender" required> Male<br>
            <input type="radio" name="gender" required> Female<br>
            <input type="radio" name="gender" required> Others
        </div>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event){
        event.preventDefault();
        let phoneInput = document.getElementById("phone").value;
        let phoneError = document.getElementById("phoneError");
        if (!/^\d{10}$/.test(phoneInput)) 
        {
            phoneError.textContent = "Phone number must be exactly 10 digits.";
            return false;
        } else {
            phoneError.textContent = ""; 
        }
        alert("Form submitted successfully!");
        this.reset(); 
    });
</script>
</body>
</html>
